<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ORBITA · Aggiungi playlist</title>
<style>
  :root { --bg: #07090f; --bg-2: #0c1019; --line: rgba(255,255,255,.13); --text: #eef1f8; --muted: #8b93ab; --accent: #7c5cff; --accent-2: #22d3ee; --ok: #34d399; --err: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.muted, small { color: var(--muted); }
  small { display: block; font-size: .8rem; margin-top: 4px; }
  .seg { display: flex; gap: 4px; padding: 4px; margin: 20px 0 8px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
  .seg button { flex: 1; padding: 10px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-weight: 600; }
  .seg button.on { background: var(--accent); color: #fff; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: .92rem; }
  input, select { width: 100%; margin-top: 6px; padding: 12px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #code { font-size: 1.4rem; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }
  details { margin-top: 16px; color: var(--muted); }
  summary { cursor: pointer; }
  button.go { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--accent), #5b8cff); }
  button.go:disabled { opacity: .5; }
  .status { margin-top: 18px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); }
  .status.ok { border-color: var(--ok); color: var(--ok); }
  .status.error { border-color: var(--err); color: var(--err); }
  [hidden] { display: none !important; }
  .fine { margin-top: 28px; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Aggiungi a <span>ORBITA</span></h1>
  <p class="muted">Compila qui e la playlist arriva sulla TV.</p>

  <form id="f" autocomplete="off" novalidate>
    <label>Codice mostrato sulla TV
      <input id="code" inputmode="numeric" maxlength="6" pattern="\d{6}" placeholder="000000" required>
    </label>

    <div class="seg" role="tablist">
      <button type="button" data-tab="xtream" class="on">Xtream Codes</button>
      <button type="button" data-tab="m3u">Link M3U</button>
    </div>

    <label>Nome <input id="name" maxlength="40" placeholder="Es. Casa"></label>

    <div data-for="xtream">
      <label>Server <input id="host" placeholder="http://server.tld:8080" autocapitalize="off" spellcheck="false">
        <small>Puoi anche incollare il link get.php completo.</small></label>
      <label>Utente <input id="user" autocapitalize="off" spellcheck="false"></label>
      <label>Password <input id="pass" type="password" autocomplete="new-password"></label>
      <label>Formato live
        <select id="format"><option value="m3u8">HLS (.m3u8) – consigliato</option><option value="ts">MPEG-TS (.ts)</option></select>
      </label>
    </div>

    <div data-for="m3u" hidden>
      <label>URL playlist <input id="url" type="url" placeholder="https://…/playlist.m3u" autocapitalize="off" spellcheck="false"></label>
    </div>

    <details>
      <summary>Opzioni avanzate</summary>
      <label>Guida TV (XMLTV) <input id="epg" type="url" placeholder="https://…/guide.xml(.gz) – opzionale" autocapitalize="off" spellcheck="false"></label>
      <label>User-Agent <input id="ua" maxlength="200" placeholder="Predefinito: VLC"></label>
    </details>

    <button class="go" type="submit">Invia alla TV</button>
  </form>

  <div id="status" class="status" hidden></div>
  <p class="fine">I dati passano solo nella rete di casa, direttamente alla TV. ORBITA non fornisce contenuti.</p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var tab = 'xtream';
  var code = (location.search.match(/[?&]c=(\d{6})/) || [])[1];
  if (code) $('code').value = code;

  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-tab');
      document.querySelectorAll('[data-tab]').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('[data-for]').forEach(function (x) { x.hidden = x.getAttribute('data-for') !== tab; });
    });
  });

  var status = $('status');
  function show(kind, msg) {
    status.hidden = false;
    status.className = 'status ' + kind;
    status.textContent = msg;
  }

  var poll;
  function watch(c) {
    clearInterval(poll);
    poll = setInterval(function () {
      fetch('/status?c=' + c, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.state === 'ok') { clearInterval(poll); show('ok', '✓ ' + (j.msg || 'Playlist aggiunta sulla TV.')); }
        else if (j.state === 'error') { clearInterval(poll); show('error', j.msg || 'Caricamento non riuscito.'); $('f').querySelector('button.go').disabled = false; }
      }).catch(function () { clearInterval(poll); });
    }, 1500);
  }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = $('code').value.replace(/\D/g, '');
    if (c.length !== 6) return show('error', 'Inserisci il codice di 6 cifre che vedi sulla TV.');
    var v = function (id) { return $(id).value.trim(); };
    var src = { type: tab, name: v('name'), epgUrl: v('epg'), ua: v('ua') };
    if (tab === 'xtream') {
      src.host = v('host'); src.user = v('user'); src.pass = $('pass').value; src.format = $('format').value;
      if (!src.host) return show('error', 'Inserisci l\'indirizzo del server.');
    } else {
      src.url = v('url');
      if (!/^https?:\/\/\S+$/i.test(src.url)) return show('error', 'Inserisci un URL http(s) valido.');
    }
    var btn = $('f').querySelector('button.go');
    btn.disabled = true;
    show('', 'Invio alla TV…');
    fetch('/add', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: c, source: src }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) { btn.disabled = false; return show('error', x.j.error || 'Invio non riuscito.'); }
        show('', 'Inviata! La TV sta caricando la playlist…');
        watch(c);
      })
      .catch(function () { btn.disabled = false; show('error', 'TV non raggiungibile. Controlla che il QR sia ancora aperto sulla TV e di essere sulla stessa rete Wi-Fi.'); });
  });
})();
</script>
</body>
</html>
