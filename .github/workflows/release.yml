name: Build APK

# - push su main / pull request: test + APK di prova scaricabile dagli "Artifacts" del run
# - tag vX.Y.Z (es. v1.0.1): APK firmato pubblicato nella Release come "orbita.apk"
#   → link stabile: https://github.com/<utente>/<repo>/releases/latest/download/orbita.apk
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dipendenze e test web
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Build interfaccia negli asset Android
        run: npx vite build --outDir android/app/src/main/assets/web --emptyOutDir

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Chiave di firma
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ORBITA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > android/orbita-release.jks

      - name: Versione
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK release
        working-directory: android
        env:
          ORBITA_VERSION_CODE: ${{ github.run_number }}
          ORBITA_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ORBITA_STOREFILE: ${{ secrets.ORBITA_KEYSTORE_BASE64 != '' && 'orbita-release.jks' || '' }}
          ORBITA_STOREPASSWORD: ${{ secrets.ORBITA_STORE_PASSWORD }}
          ORBITA_KEYALIAS: orbita
          ORBITA_KEYPASSWORD: ${{ secrets.ORBITA_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          [ -n "$ORBITA_STOREFILE" ] || unset ORBITA_STOREFILE
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release*.apk ../out/orbita.apk
          cp ../out/orbita.apk "../out/ORBITA-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: orbita-apk
          path: out/*.apk

      - name: Pubblica Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/orbita.apk
            out/ORBITA-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
